# Configuration HAProxy : Round Robin + Health Checks.
# Démo Docker : HAProxy écoute sur 8080, les serveurs sont résolus par les noms de services Compose.
# En production (TODO) : bind *:80, serveurs 192.168.1.11:8080 et 192.168.1.12:8080.

global
    log stdout format raw local0
    maxconn 1024

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_in
    bind *:8080
    default_backend web_servers

backend web_servers
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server serveur1 web1:8080 check inter 5s fall 2 rise 2
    server serveur2 web2:8080 check inter 5s fall 2 rise 2
